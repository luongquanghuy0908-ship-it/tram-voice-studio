# Build app Android (.apk) và Mac (.zip) trên máy chủ GitHub, rồi đăng lên mục Releases để tải.
# Chạy tay: tab Actions → "Build app" → Run workflow. Hoặc tự chạy mỗi lần đẩy code lên main.
name: Build app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Chuẩn bị dự án Capacitor
        run: |
          mkdir -p cap/www
          cp index.html app.js logic.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png cap/www/
          cp capacitor.config.json cap/
          cd cap
          npm init -y > /dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6.0.2 @capacitor/share@6.0.3
          npx cap add android
      - name: Gắn icon app
        run: |
          cd cap/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../../icon-1024.png "$d/ic_launcher.png"
            cp ../../../../../../icon-1024.png "$d/ic_launcher_round.png"
          done
      - name: Build APK
        run: |
          cd cap
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../TramVoiceStudio-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: TramVoiceStudio-android.apk }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build app Mac (.zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # chưa có chứng chỉ Apple -> không ký
        run: |
          mkdir -p electron/app
          cp index.html app.js logic.js manifest.webmanifest icon-192.png icon-512.png icon-1024.png apple-touch-icon.png electron/app/
          cd electron
          npm install
          npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: electron/dist/*.zip }

  release:
    needs: [android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "v1.0.${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --title "Trạm Voice Studio 1.0.${{ github.run_number }}" \
            --notes "Android: tải file .apk, mở để cài (cho phép cài từ nguồn không xác định). Mac: tải file mac .zip (arm64 cho chip M, x64 cho Intel), giải nén rồi kéo Trạm Voice Studio vào Applications; lần đầu mở: chuột phải → Open, hoặc Cài đặt hệ thống → Quyền riêng tư & Bảo mật → Vẫn mở."
